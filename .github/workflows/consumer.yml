name: Packaged Go consumer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify packaged revision
        run: |
          python3 tools/qualify_consumer.py --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/consumer.json"
          cat "$RUNNER_TEMP/consumer.json" >> "$GITHUB_STEP_SUMMARY"
